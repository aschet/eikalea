[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eikalea"
dynamic = ["version"]
description = "Seed -> LLM-invented image prompt -> optional image via ComfyUI"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "openai",
    "uncomfymcp @ git+https://github.com/aschet/uncomfymcp@v2.0.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
eikalea = "eikalea.cli:main"

[tool.hatch.version]
path = "src/eikalea/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eikalea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
