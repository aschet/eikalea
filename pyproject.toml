[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eikalea"
dynamic = ["version"]
description = "Experimental art generator inspired by the infinite monkey theorem -- LLM-synthesized prompts from seeded pools, optionally rendered via ComfyUI."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "openai",
    "dynamicprompts[yaml]",
    "Pillow",
    "uncomfymcp @ git+https://github.com/aschet/uncomfymcp@v2.0.2",
    "picsonym @ git+https://github.com/aschet/picsonym@v1.1.2",
]

[project.optional-dependencies]
gpt2 = ["dynamicprompts[magicprompt]"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
eikalea = "eikalea.cli:main"

[tool.hatch.version]
path = "src/eikalea/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eikalea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]
