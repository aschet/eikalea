[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eikalea"
dynamic = ["version"]
description = "Experimental art generator inspired by the infinite monkey theorem -- LLM-synthesized prompts from seeded pools, optionally rendered via ComfyUI."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "openai",
    "dynamicprompts[yaml]",
    "Pillow",
    "uncomfymcp @ git+https://github.com/aschet/uncomfymcp@v2.0.2",
    "picsonym @ git+https://github.com/aschet/picsonym@v1.1.2",
]

[project.optional-dependencies]
gpt2 = ["dynamicprompts[magicprompt]"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
eikalea = "eikalea.cli:main"

[tool.hatch.version]
path = "src/eikalea/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eikalea"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

# --gpt2-mode's torch/transformers dependency (the `gpt2` extra) is optional
# and heavy; skip following it into their own stubs entirely rather than
# just ignoring missing imports, since numpy's own bundled stubs (a
# transitive dependency of both torch and openai's own optional embeddings
# helper) use syntax this mypy version can't parse. Skipping numpy itself
# isn't enough -- mypy still parses it while resolving openai._extras'
# import of it, so that internal module is skipped too, one hop earlier.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "numpy", "numpy.*", "openai._extras.*"]
ignore_missing_imports = true
follow_imports = "skip"
